{{- /*
templates/assistant-secret.yaml

The service-account JWT the internal assistant authenticates with when calling
Magertron's own LLM proxy.

⚠ PLATFORM-INTERNAL, unlike the chat-daemon secret next door. That one isolates
a VENDOR key and an outbound-internet dependency from the platform's core
secrets, for good reasons stated in its own header. This is a credential
Magertron issued to itself and which is useless outside this cluster — the
separation there does not apply here. The three-path shape and the upgrade-safe
lookup are worth copying; the trust boundary is not.

Created only when:
  - assistant.saJwt is provided, AND
  - no external secret is referenced (assistant.externalSecretName empty).

⚠ A fresh install has neither, because the token does not exist until Magertron
is running and somebody mints it. That is expected. The assistant reports that
it is not configured until then.

Upgrade-safe: an existing value is reused, so a `helm upgrade` that does not
re-specify saJwt does not blank a working assistant.
*/ -}}
{{- if and (not .Values.assistant.externalSecretName) .Values.assistant.saJwt }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mcp.fullname" . }}-assistant
  namespace: {{ include "mcp.namespace" . }}
  labels:
    {{- include "mcp.labels" . | nindent 4 }}
    app.kubernetes.io/component: assistant
type: Opaque
data:
  {{- $existing := lookup "v1" "Secret" (include "mcp.namespace" .) (printf "%s-assistant" (include "mcp.fullname" .)) }}
  {{- if and $existing $existing.data (index $existing.data "MAG_SA_JWT") }}
  MAG_SA_JWT: {{ index $existing.data "MAG_SA_JWT" }}
  {{- else }}
  MAG_SA_JWT: {{ .Values.assistant.saJwt | b64enc | quote }}
  {{- end }}
{{- end }}
