# Lets mcp-inventory read catalog-source credentials.
#
# The poller resolves a source's credential_ref to a real DSN by reading the
# k8s secret directly, rather than asking the orchestrator to hand it over. An
# endpoint that returns secrets is a permanent liability — every future caller,
# every log line, every proxy in between — whereas this is one RBAC rule, in one
# namespace, that fails closed when absent.
#
# Deliberately narrow:
#   * get only. Not list, not watch — the poller knows the name it wants from
#     credential_ref, so enumerating every secret in the namespace would grant
#     reach it has no use for.
#   * Role, not ClusterRole. Scoped to the namespace holding the credentials.
#
# Without this the first sync fails with a clear Forbidden rather than silently
# doing nothing, which is the behaviour worth having.
{{- /*
  Guarded on the BLOCK as well as the flag.

  This was `if .Values.inventory.catalogIngest.enabled`, which fails helm lint
  outright when the block is absent — "nil pointer evaluating interface
  {}.enabled" — rather than rendering nothing. A chart that cannot be linted
  against a values file missing an optional section is fragile: anyone with an
  older values.yaml, or a --set-only install, hits it.
*/}}
{{- if and .Values.inventory.catalogIngest .Values.inventory.catalogIngest.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "mcp.fullname" . }}-inventory-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mcp.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "mcp.fullname" . }}-inventory-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mcp.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "mcp.fullname" . }}-inventory-credentials
subjects:
  # The inventory Deployment sets no serviceAccountName, so it runs as
  # `default` in this namespace. Binding to a name that does not exist would
  # apply cleanly and grant nothing — the poller would then fail on every sync
  # with a Forbidden that looks like a bug in the RBAC rather than a missing
  # subject.
  #
  # If mcp-inventory is ever given its own ServiceAccount, this and the
  # deployment must change together.
  - kind: ServiceAccount
    name: {{ .Values.inventory.serviceAccountName | default "default" }}
    namespace: {{ .Release.Namespace }}
{{- end }}
