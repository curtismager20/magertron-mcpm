<!doctype html>
<html>
  <head>
    <title>Magertron Platform API v1</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png"/>
    <link rel="icon" type="image/png" sizes="512x512" href="favicon-512.png"/>
    <link rel="apple-touch-icon" href="favicon-192.png"/>
    <style>
      body { margin: 0; }

      /* Magertron mark, pinned over the top of ReDoc's sidebar */
      #mt-brand {
        position: fixed;
        top: 0;
        left: 0;
        width: 260px;            /* ReDoc's default sidebar width */
        height: 56px;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 16px;
        background: #0b0b0f;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        text-decoration: none;
        z-index: 100;
      }
      #mt-brand img {
        width: 28px;
        height: 28px;
        display: block;
        border-radius: 5px;
      }
      #mt-brand span {
        color: #e8ecf4;
        font: 600 15px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        letter-spacing: 0.2px;
      }
      #mt-brand:focus-visible {
        outline: 2px solid #6aa9f8;
        outline-offset: -2px;
      }

      /* Make room for the mark above ReDoc's search box and nav */
      .menu-content { padding-top: 56px; }

      /* ReDoc collapses the sidebar into a toggle bar on narrow screens —
         hide the mark there so it doesn't cover the toggle. */
      @media (max-width: 50rem) {
        #mt-brand { display: none; }
        .menu-content { padding-top: 0; }
      }
    </style>
  </head>
  <body>
    <a id="mt-brand" href="https://magertron.com">
      <img src="favicon-192.png" alt="Magertron"/>
      <span>Magertron</span>
    </a>
    <redoc spec-url="openapi.yaml"></redoc>
    <script src="redoc.standalone.js"></script>
  </body>
</html>
